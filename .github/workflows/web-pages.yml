name: Web HMI and Console

on:
  push:
    branches:
      - main
    paths:
      - apps/vehicle-hmi/**
      - apps/demo-console/**
      - apps/web-portal/**
      - icon.png
      - .github/workflows/web-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public web artifact
        run: |
          mkdir -p _site/apps
          cp icon.png _site/icon.png
          cp -R apps/vehicle-hmi _site/apps/vehicle-hmi
          cp -R apps/demo-console _site/apps/demo-console
          cp -R apps/web-portal _site/apps/web-portal
          cp apps/web-portal/root-index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
