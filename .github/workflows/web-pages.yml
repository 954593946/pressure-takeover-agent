name: Web HMI and Console

on:
  push:
    branches:
      - main
    paths:
      - apps/vehicle-hmi/**
      - apps/vehicle-hmi-legacy/**
      - apps/demo-console/**
      - apps/web-portal/**
      - icon.png
      - .github/workflows/web-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # New repositories do not have a Pages site until it is explicitly
          # enabled. Let the workflow create/configure it instead of failing
          # with a 404 on the first deployment.
          enablement: true
      - name: Prepare public web artifact
        run: |
          mkdir -p _site/apps
          cp icon.png _site/icon.png
          cp -R apps/vehicle-hmi _site/apps/vehicle-hmi
          cp -R apps/vehicle-hmi-legacy _site/apps/vehicle-hmi-legacy
          cp -R apps/demo-console _site/apps/demo-console
          cp -R apps/web-portal _site/apps/web-portal
          cp apps/web-portal/root-index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
